version: "3.9"

services:
  api:
    build: .
    container_name: stock-analyser-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ENABLE_INFERENCE_MLFLOW: "false"
      SENTIMENT_BACKEND: vader
    volumes:
      - ./artifacts:/app/artifacts
      - ./.cache:/app/.cache
    restart: unless-stopped

  ui:
    build: .
    container_name: stock-analyser-ui
    command: python -m src.ui.gradio_app
    ports:
      - "7860:7860"
    environment:
      ENABLE_INFERENCE_MLFLOW: "false"
      SENTIMENT_BACKEND: vader
    volumes:
      - ./artifacts:/app/artifacts
      - ./.cache:/app/.cache
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow ui
      --backend-store-uri /mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped
